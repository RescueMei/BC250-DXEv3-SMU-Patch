# Per-project configuration for build_ffs.sh.

PKG_DIR="BC250DXEv3SMUPatchPkg"
PLATFORM_DSC="BC250DXEv3SMUPatchPkg/BC250DXEv3SMUPatchPkg.dsc"

# Output subdirectory name under the edk2 Build/ tree.
BUILD_PACKAGE_DIR="MeiMeiDXEv3_SMU_Patch"

MODULE_NAME="MeiMeiDXEv3_SMU_Patch"
MODULE_INF="BC250DXEv3SMUPatchPkg/BC250DXEv3SMUPatchDxe/BC250DXEv3SMUPatchDxe.inf"
MODULE_GUID="9d4e5e12-3c7a-4f88-a2b7-0d8d6b7f2e41"

# Generate the embedded Xtensa metrics payload (SmuPatchPayload.h) before
# the edk2 build, so `./build_ffs.sh` alone works (see payload/build.sh).
PREBUILD_CMD="payload/build.sh"

PACKAGES_PATH_EXTRA="BC250-DXEv3-Shared"
PROTOCOL_CHECK_CMD="python3 BC250-DXEv3-Shared/tools/check_protocol_abi.py --manifest BC250-DXEv3-Shared/tools/protocols.json --repo-root ."
